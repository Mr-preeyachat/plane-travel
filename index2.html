  <meta charset="utf-8">

  <style>
    /* Custom styles specifically for Japanese Signboard Page */
    .sign-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px 16px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: calc(100vh - 100px);
      min-height: calc(100dvh - 100px);
      justify-content: center;
    }

    .category-pills {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      width: 100%;
      padding-bottom: 12px;
      margin-bottom: 16px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .category-pills::-webkit-scrollbar { display: none; }

    .pill-btn {
      background: var(--panel);
      color: var(--muted);
      border: 1px solid var(--line);
      padding: 8px 16px;
      border-radius: 20px;
      white-space: nowrap;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .pill-btn.active, .pill-btn:hover {
      background: linear-gradient(135deg, var(--accent), var(--pink));
      color: #fff;
      border-color: transparent;
      box-shadow: 0 4px 15px rgba(141, 123, 255, 0.4);
    }

    /* Main Display Card (Signboard) */
    .display-card {
      width: 100%;
      background: linear-gradient(145deg, #151d32, #0d1322);
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .card-badge {
      background: rgba(255, 121, 176, 0.15);
      color: var(--pink);
      border: 1px solid rgba(255, 121, 176, 0.3);
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 24px;
      display: inline-block;
    }

    /* 3 Rows Layout */
    .row-jp {
      margin-bottom: 24px;
      width: 100%;
    }
    .jp-main {
      font-family: 'Noto Sans JP', sans-serif;
      font-size: clamp(32px, 8vw, 54px);
      font-weight: 900;
      line-height: 1.25;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
      background: linear-gradient(180deg, #ffffff 30%, #e0e7ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      word-break: break-word;
    }
    .jp-romaji {
      font-family: Prompt, sans-serif;
      font-size: 16px;
      color: var(--accent2);
      margin-top: 8px;
      font-weight: 500;
      letter-spacing: 0.05em;
    }

    .row-divider {
      width: 60%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
      margin: 16px 0 24px;
    }

    .row-en {
      font-size: 20px;
      font-weight: 600;
      color: #e2e8f0;
      margin-bottom: 12px;
      letter-spacing: 0.02em;
    }

    .row-th {
      font-size: 18px;
      color: #94a3b8;
      font-weight: 400;
      line-height: 1.5;
    }
    .th-pronounce {
      color: #f472b6;
      font-weight: 500;
      display: block;
      font-size: 15px;
      margin-top: 4px;
    }

    /* Card Controls */
    .card-actions {
      display: flex;
      gap: 12px;
      margin-top: 32px;
      width: 100%;
      justify-content: center;
      flex-wrap: wrap;
    }

    .action-btn {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      padding: 12px 20px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }
    .action-btn:hover, .action-btn:active {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }
    .action-btn.speech-btn {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border: none;
    }

    /* Navigation Prev/Next Controls */
    .nav-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-top: 24px;
    }

    .nav-circle-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--panel2);
      border: 1px solid var(--line);
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: all 0.2s ease;
    }
    .nav-circle-btn:hover {
      background: var(--accent);
      border-color: var(--accent);
    }

    .counter-text {
      font-size: 14px;
      color: var(--muted);
      font-weight: 500;
    }

    /* Drawer Search */
    .search-box {
      padding: 12px 16px;
      margin-bottom: 16px;
    }
    .search-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 14px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    .search-input:focus {
      border-color: var(--accent);
    }

    .phrase-list-group {
      margin-bottom: 20px;
    }
    .phrase-group-title {
      font-size: 12px;
      letter-spacing: 0.1em;
      color: var(--pink);
      text-transform: uppercase;
      margin-bottom: 8px;
      padding-left: 8px;
      font-weight: 600;
    }
    .phrase-item {
      display: block;
      padding: 10px 12px;
      border-radius: 10px;
      color: var(--text);
      transition: background 0.2s ease;
      cursor: pointer;
      margin-bottom: 4px;
    }
    .phrase-item:hover, .phrase-item.active {
      background: rgba(141, 123, 255, 0.15);
      color: #fff;
    }
    .phrase-item div {
      font-weight: 500;
      font-size: 14px;
    }
    .phrase-item small {
      font-size: 12px;
      color: var(--muted);
      display: block;
    }
  </style>
</head>

        romaji: 'Ryoushuusho o itadakemasu ka?',
        en: 'May I have a receipt, please?',
        th: 'ขอใบเสร็จรับเงินด้วยครับ/ค่ะ',
        pronounce: 'เรียวชูโช โอะ อิตาดาเคมัส กะ?'
      },

      // 4. การเดินทาง & ทิศทาง (Directions & Transport)
      {
        id: 'p20',
        cat: 'directions',
        catName: '🗺️ ทิศทาง & สถานที่',
        jp: '駅はどこですか？',
        romaji: 'Eki wa doko desu ka?',
        en: 'Where is the train station?',
        th: 'สถานีรถไฟอยู่ที่ไหนครับ/ค่ะ?',
        pronounce: 'เอคิ วะ โดโกะ เดส กะ?'
      },
      {
        id: 'p21',
        cat: 'directions',
        catName: '🗺️ ทิศทาง & สถานที่',
        jp: 'トイレはどこですか？',
        romaji: 'Toire wa doko desu ka?',
        en: 'Where is the restroom?',
        th: 'ห้องน้ำอยู่ที่ไหนครับ/ค่ะ?',
        pronounce: 'โตอิเระ วะ โดโกะ เดส กะ?'
      },
      {
        id: 'p22',
        cat: 'directions',
        catName: '🗺️ ทิศทาง & สถานที่',
        jp: 'ゴミ箱はどこですか？',
        romaji: 'Gomibako wa doko desu ka?',
        en: 'Where is the trash can?',
        th: 'ถังขยะอยู่ที่ไหนครับ/ค่ะ?',
        pronounce: 'โกมิบาโกะ วะ โดโกะ เดส กะ?'
      },

      // 5. คำสุภาพ & ทั่วไป (Courtesy & General)
      {
        id: 'p23',
        cat: 'courtesy',
        catName: '💬 คำสุภาพ & ทั่วไป',
        jp: 'すみません。',
        romaji: 'Sumimasen.',
        en: 'Excuse me / Sorry.',
        th: 'ขอโทษครับ/ค่ะ (ใช้เรียกพนักงานหรือขอทาง)',
        pronounce: 'สุมิมาเซน'
      },
      {
        id: 'p24',
        cat: 'courtesy',
        catName: '💬 คำสุภาพ & ทั่วไป',
        jp: 'ありがとうございます！',
        romaji: 'Arigatou gozaimasu!',
        en: 'Thank you very much!',
        th: 'ขอบคุณมากครับ/ค่ะ!',
        pronounce: 'อาริกาโตะ โกไซมัส!'
      },
      {
        id: 'p25',
        cat: 'courtesy',
        catName: '💬 คำสุภาพ & ทั่วไป',
        jp: 'とても美味しかったです！',
        romaji: 'Totemo oishikatta desu!',
        en: 'It was very delicious!',
        th: 'อร่อยมากเลยครับ/ค่ะ!',
        pronounce: 'โตเตโมะ โออิชิก็ัตตะ เดส!'
      },
      {
        id: 'p26',
        cat: 'courtesy',
        catName: '💬 คำสุภาพ & ทั่วไป',
        jp: '大丈夫です。',
        romaji: 'Daijoubu desu.',
        en: 'It\'s okay / No problem / No thank you.',
        th: 'ไม่เป็นไรครับ/ค่ะ / ไม่รับครับ',
        pronounce: 'ไดโจบุ เดส'
      }
    ];

    // App State
    let currentFilteredList = [...phraseData];
    let currentIndex = 0;
    let selectedCat = 'all';

    // DOM Elements
    const $ = selector => document.querySelector(selector);
    const drawer = $('#drawer');
    const scrim = $('#scrim');

    // Categories definition
    const categories = [
      { id: 'all', name: '✨ ทั้งหมด' },
      { id: 'fishmarket', name: '🐟 ตลาดปลา & อาหารสด' },
      { id: 'queue', name: '🚶 คิว & การจอง' },
      { id: 'payment', name: '💰 ชำระเงิน' },
      { id: 'directions', name: '🗺️ ทิศทาง' },
      { id: 'courtesy', name: '💬 คำสุภาพ' }
    ];

    function init() {
      renderCategoryPills();
      renderDrawerList(phraseData);
      updateDisplay();

      // Event Listeners
      $('#menuBtn').onclick = () => { drawer.classList.add('open'); scrim.classList.add('show'); };
      $('#closeMenu').onclick = () => { drawer.classList.remove('open'); scrim.classList.remove('show'); };
      scrim.onclick = () => { drawer.classList.remove('open'); scrim.classList.remove('show'); };

      $('#prevBtn').onclick = prevPhrase;
      $('#nextBtn').onclick = nextPhrase;

      $('#speakBtn').onclick = speakJapanese;
      $('#copyBtn').onclick = copyText;

      $('#searchInput').oninput = (e) => filterSearch(e.target.value);

      // Keyboard navigation
      document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') prevPhrase();
        if (e.key === 'ArrowRight') nextPhrase();
      });
    }

    function renderCategoryPills() {
      const pillsContainer = $('#categoryPills');
      pillsContainer.innerHTML = categories.map(c => `
        <button class="pill-btn ${c.id === selectedCat ? 'active' : ''}" onclick="selectCategory('${c.id}')">
          ${c.name}
        </button>
      `).join('');
    }

    function selectCategory(catId) {
      selectedCat = catId;
      renderCategoryPills();
      if (catId === 'all') {
        currentFilteredList = [...phraseData];
      } else {
        currentFilteredList = phraseData.filter(p => p.cat === catId);
      }
      currentIndex = 0;
      updateDisplay();
    }

    function updateDisplay() {
      if (currentFilteredList.length === 0) {
        $('#cardCategory').textContent = 'ไม่พบข้อมูล';
        $('#textJp').textContent = '該当なし';
        $('#textRomaji').textContent = '-';
        $('#textEn').textContent = 'No matching phrases found';
        $('#textTh').textContent = 'ไม่พบประโยคที่ค้นหา';
        $('#textPronounce').textContent = '';
        $('#counterText').textContent = '0 / 0';
        return;
      }

      const item = currentFilteredList[currentIndex];
      $('#cardCategory').textContent = item.catName;
      $('#textJp').textContent = item.jp;
      $('#textRomaji').textContent = item.romaji;
      $('#textEn').textContent = item.en;
      $('#textTh').textContent = item.th;
      $('#textPronounce').textContent = item.pronounce ? `อ่านว่า: ${item.pronounce}` : '';
      $('#counterText').textContent = `${currentIndex + 1} / ${currentFilteredList.length}`;

      // Highlight item in drawer if open
      document.querySelectorAll('.phrase-item').forEach(el => {
        el.classList.toggle('active', el.dataset.id === item.id);
      });
    }

    function prevPhrase() {
      if (currentFilteredList.length === 0) return;
      currentIndex = (currentIndex - 1 + currentFilteredList.length) % currentFilteredList.length;
      updateDisplay();
    }

    function nextPhrase() {
      if (currentFilteredList.length === 0) return;
      currentIndex = (currentIndex + 1) % currentFilteredList.length;
      updateDisplay();
    }

    function renderDrawerList(data) {
      const container = $('#drawerPhraseList');
      if (data.length === 0) {
        container.innerHTML = '<div style="padding:16px; color:var(--muted); text-align:center;">ไม่พบประโยคที่ค้นหา</div>';
        return;
      }

      // Group by category
      const groups = {};
      data.forEach(item => {
        if (!groups[item.catName]) groups[item.catName] = [];
        groups[item.catName].push(item);
      });

      let html = '';
      for (const [catName, items] of Object.entries(groups)) {
        html += `
          <div class="phrase-list-group">
            <div class="phrase-group-title">${catName}</div>
            ${items.map(item => `
              <div class="phrase-item" data-id="${item.id}" onclick="jumpToPhrase('${item.id}')">
                <div>${item.jp}</div>
                <small>${item.th}</small>
              </div>
            `).join('')}
          </div>
        `;
      }
      container.innerHTML = html;
    }

    function jumpToPhrase(id) {
      const idx = currentFilteredList.findIndex(p => p.id === id);
      if (idx !== -1) {
        currentIndex = idx;
      } else {
        // If not in current filtered list, reset filter to 'all'
        selectedCat = 'all';
        currentFilteredList = [...phraseData];
        renderCategoryPills();
        currentIndex = phraseData.findIndex(p => p.id === id);
      }
      updateDisplay();
      drawer.classList.remove('open');
      scrim.classList.remove('show');
    }

    function filterSearch(query) {
      const q = query.toLowerCase().trim();
      if (!q) {
        currentFilteredList = selectedCat === 'all' ? [...phraseData] : phraseData.filter(p => p.cat === selectedCat);
        renderDrawerList(currentFilteredList);
        currentIndex = 0;
        updateDisplay();
        return;
      }

      const filtered = phraseData.filter(p => 
        p.jp.toLowerCase().includes(q) ||
        p.romaji.toLowerCase().includes(q) ||
        p.en.toLowerCase().includes(q) ||
        p.th.toLowerCase().includes(q) ||
        p.pronounce.toLowerCase().includes(q)
      );

      currentFilteredList = filtered;
      renderDrawerList(filtered);
      currentIndex = 0;
      updateDisplay();
    }

    function speakJapanese() {
      if (currentFilteredList.length === 0) return;
      const text = currentFilteredList[currentIndex].jp;
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // Stop any active speech
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ja-JP';
        utterance.rate = 0.85; // Slightly slower for clear understanding
        window.speechSynthesis.speak(utterance);
      } else {
        alert('เบราว์เซอร์ของคุณไม่รองรับระบบออกเสียงอัตโนมัติ');
      }
    }

    function copyText() {
      if (currentFilteredList.length === 0) return;
      const item = currentFilteredList[currentIndex];
      const textToCopy = `${item.jp}\n${item.en}\n${item.th}`;
      navigator.clipboard.writeText(textToCopy).then(() => {
        const copyBtn = $('#copyBtn');
        const origText = copyBtn.innerHTML;
        copyBtn.innerHTML = '<span>✅ คัดลอกแล้ว!</span>';
        setTimeout(() => copyBtn.innerHTML = origText, 2000);
      }).catch(err => {
        alert('คัดลอกไม่สำเร็จ');
      });
    }

    window.onload = init;
  </script>
</body>
</html>
